<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>מסע במעבדת ה־EP</title>
  <meta name="description" content="סיור תלת־ממדי לילדים במעבדת אלקטרופיזיולוגיה: מה אבא, מהנדס מערכות בג'ונסון אנד ג'ונסון מדטק, עושה בעבודה">
  <meta name="theme-color" content="#0b1024">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="scene" aria-label="הדמיה תלת־ממדית של מעבדת אלקטרופיזיולוגיה"></div>
  <div id="labels"></div>

  <header class="topbar">
    <h1 class="brand">❤️ מסע במעבדת ה־EP</h1>
    <div class="actions">
      <button id="btn-tour" class="btn btn-primary" type="button">▶ <span class="hide-phone">סיור מודרך</span></button>
      <button id="btn-overview" class="btn" type="button" title="מבט על כל המעבדה">🗺️ <span class="hide-phone">כל המעבדה</span></button>
      <button id="btn-glossary" class="btn" type="button" title="מילון מושגים">📖 <span class="hide-phone">מילון</span></button>
      <button id="btn-guide" class="btn btn-icon" type="button" aria-pressed="true" title="הסתרת נועם המדריך">👦</button>
      <button id="btn-voice" class="btn btn-icon" type="button" aria-pressed="true" title="השתקת הקריין">🔊</button>
    </div>
  </header>

  <aside id="panel" class="panel" aria-live="polite" hidden>
    <div class="panel-body" id="panel-body"></div>
    <nav class="panel-nav" aria-label="מעבר בין תחנות">
      <button id="btn-prev" class="btn" type="button">→ הקודמת</button>
      <div class="dots" id="dots"></div>
      <button id="btn-next" class="btn btn-primary" type="button">הבאה ←</button>
    </nav>
  </aside>

  <div id="presenter" class="presenter" aria-hidden="true"></div>

  <div id="intro" class="intro">
    <div class="intro-card">
      <div class="intro-emoji">❤️⚡🗺️</div>
      <h2>מסע במעבדת ה־EP</h2>
      <p>מה אבא עושה בעבודה? בואו נטייל בתלת־ממד בחדר מיוחד בבית החולים, שבו מתקנים את <b>החשמל של הלב</b>.</p>
      <p class="muted">נועם, המדריך מהמסע במערכת השמש, יסביר על כל תחנה בקול.</p>
      <div class="intro-actions">
        <button id="btn-start" class="btn btn-primary btn-big" type="button">▶ מתחילים את הסיור</button>
        <button id="btn-explore" class="btn btn-big" type="button">🔍 לטייל לבד</button>
      </div>
    </div>
  </div>

  <dialog id="glossary" aria-labelledby="glossary-title">
    <div class="dlg-head">
      <h2 id="glossary-title">📖 מילון מושגים</h2>
      <button class="btn btn-icon" type="button" id="glossary-close" aria-label="סגירה">✕</button>
    </div>
    <div class="dlg-body" id="glossary-list"></div>
  </dialog>

  <noscript><p class="noscript">כדי לראות את המעבדה צריך להפעיל JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
